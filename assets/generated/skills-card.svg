<svg xmlns="http://www.w3.org/2000/svg" width="835" height="330" viewBox="0 0 835 330">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF6347"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="819" height="314" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="314" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="314" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="314" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Title -->
  <text x="45" y="50" fill="#FF4500" font-size="20" font-weight="800" font-family="'Segoe UI', sans-serif">🎯  Skill Proficiency</text>
  <line x1="45" y1="65" x2="790" y2="65" stroke="#FF450025" stroke-width="1"/>

  <!-- Skill 1: Flutter -->
  <text x="55" y="100" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Flutter / Dart</text>
  <rect x="200" y="87" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="87" width="432" height="18" rx="9" fill="url(#barGrad)" opacity="0.85"/>
  <text x="700" y="101" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">90%</text>
  <text x="755" y="101" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Expert</text>

  <!-- Skill 2: Firebase -->
  <text x="55" y="140" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Firebase</text>
  <rect x="200" y="127" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="127" width="408" height="18" rx="9" fill="url(#barGrad)" opacity="0.75"/>
  <text x="700" y="141" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">85%</text>
  <text x="755" y="141" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Advanced</text>

  <!-- Skill 3: Figma -->
  <text x="55" y="180" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Figma / UI Design</text>
  <rect x="200" y="167" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="167" width="408" height="18" rx="9" fill="url(#barGrad)" opacity="0.75"/>
  <text x="700" y="181" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">85%</text>
  <text x="755" y="181" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Advanced</text>

  <!-- Skill 4: REST APIs -->
  <text x="55" y="220" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">REST APIs</text>
  <rect x="200" y="207" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="207" width="384" height="18" rx="9" fill="url(#barGrad)" opacity="0.7"/>
  <text x="700" y="221" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">80%</text>
  <text x="755" y="221" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Advanced</text>

  <!-- Skill 5: Supabase -->
  <text x="55" y="260" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Supabase</text>
  <rect x="200" y="247" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="247" width="360" height="18" rx="9" fill="url(#barGrad)" opacity="0.65"/>
  <text x="700" y="261" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">75%</text>
  <text x="755" y="261" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Proficient</text>

  <!-- Skill 6: Git -->
  <text x="55" y="300" fill="#c9d1d9" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Git / GitHub</text>
  <rect x="200" y="287" width="480" height="18" rx="9" fill="#21262d"/>
  <rect x="200" y="287" width="408" height="18" rx="9" fill="url(#barGrad)" opacity="0.75"/>
  <text x="700" y="301" fill="#FF4500" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">85%</text>
  <text x="755" y="301" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">Advanced</text>
</svg>
