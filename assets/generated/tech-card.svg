<svg xmlns="http://www.w3.org/2000/svg" width="835" height="260" viewBox="0 0 835 260">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="819" height="244" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="244" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="244" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="244" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Title -->
  <text x="45" y="50" fill="#FF4500" font-size="20" font-weight="800" font-family="'Segoe UI', sans-serif">🛠️  Tech Arsenal</text>
  <line x1="45" y1="65" x2="790" y2="65" stroke="#FF450025" stroke-width="1"/>

  <!-- Row 1: Core -->
  <text x="55" y="98" fill="#8b949e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="1">CORE</text>
  <rect x="120" y="82" width="80" height="28" rx="14" fill="#02569B20" stroke="#02569B80" stroke-width="1"/>
  <text x="160" y="101" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Flutter</text>
  <rect x="210" y="82" width="60" height="28" rx="14" fill="#0175C220" stroke="#0175C280" stroke-width="1"/>
  <text x="240" y="101" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Dart</text>

  <!-- Row 2: Backend -->
  <text x="55" y="140" fill="#8b949e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="1">BACKEND</text>
  <rect x="135" y="124" width="80" height="28" rx="14" fill="#FFCA2815" stroke="#FFCA2860" stroke-width="1"/>
  <text x="175" y="143" text-anchor="middle" fill="#FFCA28" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Firebase</text>
  <rect x="225" y="124" width="85" height="28" rx="14" fill="#3FCF8E15" stroke="#3FCF8E60" stroke-width="1"/>
  <text x="267" y="143" text-anchor="middle" fill="#3FCF8E" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Supabase</text>
  <rect x="320" y="124" width="68" height="28" rx="14" fill="#FF450015" stroke="#FF450060" stroke-width="1"/>
  <text x="354" y="143" text-anchor="middle" fill="#FF4500" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Isar DB</text>
  <rect x="398" y="124" width="80" height="28" rx="14" fill="#00968815" stroke="#00968860" stroke-width="1"/>
  <text x="438" y="143" text-anchor="middle" fill="#26A69A" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">REST API</text>
  <rect x="488" y="124" width="80" height="28" rx="14" fill="#FF6C3715" stroke="#FF6C3760" stroke-width="1"/>
  <text x="528" y="143" text-anchor="middle" fill="#FF6C37" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Postman</text>

  <!-- Row 3: Design -->
  <text x="55" y="182" fill="#8b949e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="1">DESIGN</text>
  <rect x="120" y="166" width="68" height="28" rx="14" fill="#F24E1E15" stroke="#F24E1E60" stroke-width="1"/>
  <text x="154" y="185" text-anchor="middle" fill="#F24E1E" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Figma</text>
  <rect x="198" y="166" width="70" height="28" rx="14" fill="#00C4CC15" stroke="#00C4CC60" stroke-width="1"/>
  <text x="233" y="185" text-anchor="middle" fill="#00C4CC" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Canva</text>

  <!-- Row 4: Tools -->
  <text x="55" y="224" fill="#8b949e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="1">TOOLS</text>
  <rect x="110" y="208" width="50" height="28" rx="14" fill="#F0503215" stroke="#F0503260" stroke-width="1"/>
  <text x="135" y="227" text-anchor="middle" fill="#F05032" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Git</text>
  <rect x="170" y="208" width="72" height="28" rx="14" fill="#ffffff10" stroke="#ffffff30" stroke-width="1"/>
  <text x="206" y="227" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">GitHub</text>
  <rect x="252" y="208" width="115" height="28" rx="14" fill="#3DDC8415" stroke="#3DDC8460" stroke-width="1"/>
  <text x="309" y="227" text-anchor="middle" fill="#3DDC84" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Android Studio</text>
  <rect x="377" y="208" width="78" height="28" rx="14" fill="#007ACC15" stroke="#007ACC60" stroke-width="1"/>
  <text x="416" y="227" text-anchor="middle" fill="#007ACC" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">VS Code</text>

  <!-- State Management tags on right -->
  <text x="600" y="98" fill="#8b949e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" letter-spacing="1">STATE</text>
  <rect x="650" y="82" width="78" height="28" rx="14" fill="#FF450015" stroke="#FF450060" stroke-width="1"/>
  <text x="689" y="101" text-anchor="middle" fill="#FF4500" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Provider</text>
  <rect x="650" y="118" width="60" height="28" rx="14" fill="#8B14F815" stroke="#8B14F860" stroke-width="1"/>
  <text x="680" y="137" text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">GetX</text>
  <rect x="718" y="118" width="78" height="28" rx="14" fill="#00ACC115" stroke="#00ACC160" stroke-width="1"/>
  <text x="757" y="137" text-anchor="middle" fill="#00ACC1" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Riverpod</text>
</svg>
