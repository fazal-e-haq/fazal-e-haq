<svg xmlns="http://www.w3.org/2000/svg" width="835" height="200" viewBox="0 0 835 200">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="819" height="184" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="184" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="184" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="184" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Title -->
  <text x="45" y="50" fill="#FF4500" font-size="20" font-weight="800" font-family="'Segoe UI', sans-serif">💡  What I Build</text>
  <line x1="45" y1="65" x2="790" y2="65" stroke="#FF450025" stroke-width="1"/>

  <!-- Card 1: Apps -->
  <rect x="45" y="80" width="230" height="95" rx="14" fill="#FF450008" stroke="#FF450030" stroke-width="1"/>
  <text x="160" y="108" text-anchor="middle" fill="#FF4500" font-size="16" font-weight="800" font-family="'Segoe UI', sans-serif">📱 Cross-Platform Apps</text>
  <text x="160" y="132" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">High-performance mobile apps</text>
  <text x="160" y="150" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">built with Flutter — one codebase.</text>

  <!-- Card 2: Design -->
  <rect x="295" y="80" width="230" height="95" rx="14" fill="#FF450008" stroke="#FF450030" stroke-width="1"/>
  <text x="410" y="108" text-anchor="middle" fill="#FF4500" font-size="16" font-weight="800" font-family="'Segoe UI', sans-serif">🎨 Product Design</text>
  <text x="410" y="132" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Wireframes to pixel-perfect UIs</text>
  <text x="410" y="150" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">in Figma — design-driven dev.</text>

  <!-- Card 3: Full-Stack -->
  <rect x="545" y="80" width="265" height="95" rx="14" fill="#FF450008" stroke="#FF450030" stroke-width="1"/>
  <text x="677" y="108" text-anchor="middle" fill="#FF4500" font-size="16" font-weight="800" font-family="'Segoe UI', sans-serif">🚀 Full-Stack Solutions</text>
  <text x="677" y="132" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">Firebase + Supabase + REST APIs</text>
  <text x="677" y="150" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Segoe UI', sans-serif">— end-to-end development.</text>
</svg>
