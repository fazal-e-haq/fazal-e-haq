<svg xmlns="http://www.w3.org/2000/svg" width="835" height="170" viewBox="0 0 835 170">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="819" height="154" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="154" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="154" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="154" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Title -->
  <text x="45" y="50" fill="#FF4500" font-size="20" font-weight="800" font-family="'Segoe UI', sans-serif">🤝  Let's Connect</text>
  <line x1="45" y1="65" x2="790" y2="65" stroke="#FF450025" stroke-width="1"/>

  <!-- Portfolio -->
  <rect x="55" y="82" width="160" height="36" rx="18" fill="#FF450018" stroke="#FF450060" stroke-width="1.2"/>
  <text x="135" y="105" text-anchor="middle" fill="#FF4500" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">🌐  Portfolio</text>

  <!-- LinkedIn -->
  <rect x="230" y="82" width="160" height="36" rx="18" fill="#0A66C218" stroke="#0A66C260" stroke-width="1.2"/>
  <text x="310" y="105" text-anchor="middle" fill="#4DA3E8" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">💼  LinkedIn</text>

  <!-- Gmail -->
  <rect x="405" y="82" width="130" height="36" rx="18" fill="#EA433518" stroke="#EA433560" stroke-width="1.2"/>
  <text x="470" y="105" text-anchor="middle" fill="#EA4335" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">📧  Gmail</text>

  <!-- Instagram -->
  <rect x="550" y="82" width="160" height="36" rx="18" fill="#E4405F18" stroke="#E4405F60" stroke-width="1.2"/>
  <text x="630" y="105" text-anchor="middle" fill="#E4405F" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">📸  Instagram</text>

  <!-- Footer text -->
  <text x="417" y="145" text-anchor="middle" fill="#3b4252" font-size="11" font-family="'Segoe UI', sans-serif">If you like what I do, consider giving a ⭐ — it fuels the fire!</text>
</svg>
