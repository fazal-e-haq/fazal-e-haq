<svg xmlns="http://www.w3.org/2000/svg" width="835" height="310" viewBox="0 0 835 310">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="819" height="294" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="294" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="294" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="294" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Section title -->
  <text x="45" y="50" fill="#FF4500" font-size="20" font-weight="800" font-family="'Segoe UI', sans-serif" letter-spacing="0.5">🧑‍💻  About Me</text>
  <line x1="45" y1="65" x2="790" y2="65" stroke="#FF450025" stroke-width="1"/>

  <!-- Bullet points -->
  <circle cx="55" cy="96" r="3" fill="#FF4500"/>
  <text x="70" y="100" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">I build <tspan fill="#FF6347" font-weight="700">digital products</tspan> that solve real-world problems and delight users.</text>

  <circle cx="55" cy="130" r="3" fill="#FF4500"/>
  <text x="70" y="134" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">Specialized in <tspan fill="#FF6347" font-weight="700">Flutter</tspan> — crafting cross-platform apps from a single codebase.</text>

  <circle cx="55" cy="164" r="3" fill="#FF4500"/>
  <text x="70" y="168" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">Passionate about <tspan fill="#FF6347" font-weight="700">UI/UX Design</tspan> — every screen starts as a wireframe in Figma.</text>

  <circle cx="55" cy="198" r="3" fill="#FF4500"/>
  <text x="70" y="202" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">Experienced with <tspan fill="#FF6347" font-weight="700">Firebase</tspan>, <tspan fill="#FF6347" font-weight="700">Supabase</tspan>, and <tspan fill="#FF6347" font-weight="700">REST APIs</tspan> for scalable backends.</text>

  <circle cx="55" cy="232" r="3" fill="#FF4500"/>
  <text x="70" y="236" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">My philosophy: <tspan fill="#FF6347" font-weight="700">Design first, then code</tspan> — pixel-perfect, every single time.</text>

  <circle cx="55" cy="266" r="3" fill="#FF4500"/>
  <text x="70" y="270" fill="#c9d1d9" font-size="14" font-family="'Segoe UI', sans-serif">Based in <tspan fill="#FF6347" font-weight="700">Pakistan</tspan> 🇵🇰 — open to remote collaborations worldwide.</text>
</svg>
