<svg xmlns="http://www.w3.org/2000/svg" width="835" height="230" viewBox="0 0 835 230">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FF6347" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF6347" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="outerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF4500" flood-opacity="0.25"/>
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF4500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card shell -->
  <rect x="8" y="8" width="819" height="214" rx="20" fill="none" filter="url(#outerGlow)"/>
  <rect x="8" y="8" width="819" height="214" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="819" height="214" rx="20" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="819" height="214" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Avatar -->
  <circle cx="80" cy="82" r="44" fill="none" stroke="#FF4500" stroke-width="2.5" stroke-opacity="0.5"/>
  <circle cx="80" cy="82" r="39" fill="#1a1f29"/>
  <text x="80" y="74" text-anchor="middle" fill="#FF4500" font-size="30" font-weight="800" font-family="'Segoe UI', sans-serif">F</text>
  <text x="80" y="102" text-anchor="middle" fill="#FF6347" font-size="17" font-weight="700" font-family="'Segoe UI', sans-serif">H</text>

  <!-- Name -->
