  <text x="891" y="35" fill="#FF5A1F" font-size="12" font-weight="500" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" letter-spacing="0" text-anchor="start" >Home — Frame 01</text>
