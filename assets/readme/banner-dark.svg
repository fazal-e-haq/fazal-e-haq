<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fazal-e-Haq — Flutter Developer and Product Designer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#52525B" opacity="0.45"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
      .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; }
      .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
      .d5 { animation-delay: .45s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .pulse { transform-origin: 86px 343px; animation: pulse 2.4s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.8); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .rise, .pulse { animation: none; } .pulse { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="#0A0A0B"/>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotsMask)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#232327"/>
  <g class="rise d1">
  <text x="72" y="112" fill="#FF5A1F" font-size="14" font-weight="600" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" letter-spacing="2.5" text-anchor="start" >FLUTTER DEVELOPER  /  PRODUCT DESIGNER</text>
  </g>
  <g class="rise d2">
  <text x="68" y="206" fill="#F4F4F5" font-size="88" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing="-3" text-anchor="start" >Fazal-e-Haq</text>
  </g>
  <g class="rise d3">
  <text x="72" y="260" fill="#A1A1AA" font-size="26" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing="-0.3" text-anchor="start" >From first sketch to shipped app.</text>
  </g>
  <g class="rise d4">
    <rect x="66" y="325" width="226" height="36" rx="18" fill="#111113" stroke="#232327"/>
