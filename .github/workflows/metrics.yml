name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */6 * * *"    # Every 6 hours
  workflow_dispatch:          # Manual trigger
  push:
    branches: [main]

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom SVG metrics
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_metrics.py

      - name: Commit & Push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          git diff --staged --quiet || git commit -m "📊 Auto-update profile metrics [skip ci]"
          git push
